plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.yeondenn.promochecklist'
    compileSdk 32

    defaultConfig {
        applicationId 'io.github.yeondenn.promochecklist'
        minSdk 26
        targetSdk 32
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
